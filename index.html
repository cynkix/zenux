<title>Le PDLC augmenté</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Mise en page : une montre (le cadran = la diapo) à gauche, le texte et les détails cliquables à droite, une couronne pour naviguer. */
:root{
  --bg:#08080a;            /* fond de vitrine */
  --surface:#131316;       /* cartes */
  --line:#2a2a30;          /* filets */
  --fg:#f3f2f6;            /* texte */
  --muted:#a09ea8;         /* texte secondaire */
  --fg2:#d8d6de; --dim:#6f6d76; --mid:#55545c; --faint:#2c2c32; --line2:#4a4a52; --surface2:#1f1f24;
  --accent:#ee2238;        /* rouge Zenika */
  --glow:#ee2238;          /* halo, suit la diapo */
  --f-ui:"Nunito", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;-webkit-font-smoothing:antialiased}
.halo{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60vmax 50vmax at 22% 48%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 70%);transition:background .8s ease}
.app{position:relative;z-index:1;max-width:1220px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 28px;display:flex;flex-direction:column;gap:clamp(20px,3vw,36px);min-height:100vh;box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-weight:900;letter-spacing:.02em;font-size:18px}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.btn-faces{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn-faces:hover{border-color:var(--line2)}
.btn-faces svg{width:16px;height:16px}

/* Scène */
.stage{flex:1;display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:clamp(32px,6vw,88px);align-items:center}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}}

/* Montre */
.watch{position:relative;width:100%;max-width:400px;margin-inline:auto;padding-right:18px;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:pan-y}
@media (max-width:860px){.watch{max-width:330px}}
.strap{height:34px;margin-inline:18%;background:linear-gradient(180deg,#19191c,#0e0e10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.strap.t{border-radius:16px 16px 4px 4px;margin-bottom:-6px}
.strap.b{border-radius:4px 4px 16px 16px;margin-top:-6px}
.case{position:relative;border-radius:26% / 21.5%;padding:5.2%;background:linear-gradient(150deg,#46464c 0%,#1a1a1e 38%,#121215 62%,#3a3a40 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09), inset 0 2px 1px rgba(255,255,255,.12), 0 40px 90px rgba(0,0,0,.65)}
.screen{position:relative;aspect-ratio:368/448;border-radius:21% / 17.5%;background:#000;overflow:hidden;box-shadow:inset 0 0 0 1.5px #050505}
.screen svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.screen svg.enter{animation:faceIn .42s cubic-bezier(.2,.8,.2,1)}
@keyframes faceIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.crown{position:absolute;right:-17px;top:21%;width:19px;height:14%;border:0;padding:0;border-radius:7px;cursor:pointer;background:repeating-linear-gradient(180deg,#6a6a72 0 2px,#2c2c31 2px 4px);background-size:100% 8px;box-shadow:inset -2px 0 3px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.6);transition:background-position .3s ease}
.crown::after{content:"";position:absolute;right:-3px;top:50%;width:5px;height:42%;transform:translateY(-50%);border-radius:3px;background:var(--accent)}
.sidebtn{position:absolute;right:-9px;top:43%;width:10px;height:19%;border:0;padding:0;border-radius:5px;cursor:pointer;background:linear-gradient(90deg,#2a2a2f,#55555c);box-shadow:0 2px 5px rgba(0,0,0,.6)}
.crown:hover,.sidebtn:hover{filter:brightness(1.25)}
.watch-hint{margin-top:14px;text-align:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}

/* Éléments du cadran */
.hit{cursor:pointer}
.hit:hover{filter:brightness(1.3)}
.orbit{transform-box:view-box;transform-origin:184px 236px;animation:spin 26s linear infinite}
.flow{animation:dash 1.4s linear infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.spineGlow{animation:spineGlow 3.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes pulse{50%{opacity:.35}}
@keyframes spineGlow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.55}}
@media (prefers-reduced-motion:reduce){.orbit,.flow,.pulse,.spineGlow,.screen svg.enter{animation:none}}

/* Panneau */
.panel{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow)}
.eyebrow b{color:var(--fg);font-weight:600}
h1{margin:0;font-weight:900;font-size:clamp(30px,4.2vw,50px);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--glow)}
.sub{margin:0;font-size:20px;font-weight:700;color:var(--muted);text-wrap:balance}
.prose{display:flex;flex-direction:column;gap:10px;max-width:62ch}
.prose p{margin:0;font-size:16.5px;line-height:1.58;color:var(--fg2)}
.prose p.lead{color:var(--fg);font-weight:700}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;max-width:62ch;min-height:96px;box-sizing:border-box}
.detail .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.detail .k i{width:10px;height:10px;border-radius:50%;display:inline-block}
.detail h2{margin:0;font-size:20px;font-weight:800}
.detail p{margin:0;font-size:15.5px;line-height:1.5;color:var(--fg2)}
.detail .meta{font-size:13.5px;color:var(--muted)}
.detail.empty{justify-content:center}
/* Quand un élément est sélectionné : le texte d'intro passe en retrait, la carte détail prend la couleur de l'élément et s'anime à chaque changement */
.panel.focus .prose,.panel.focus .sub{opacity:.42;transition:opacity .35s}
.panel.focus .prose:hover{opacity:1}
.detail.on{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:inset 3px 0 0 var(--c),0 0 24px color-mix(in srgb,var(--c) 18%,transparent)}
.detail.flash{animation:dflash .55s cubic-bezier(.2,.8,.2,1)}
@keyframes dflash{0%{opacity:0;transform:translateY(10px);box-shadow:inset 3px 0 0 var(--c),0 0 0 2px var(--c),0 0 40px color-mix(in srgb,var(--c) 45%,transparent)}100%{opacity:1;transform:none}}
.panel.flash .prose,.panel.flash .sub{animation:dimIn .35s ease}
@keyframes dimIn{from{opacity:1}}
@media (prefers-reduced-motion:reduce){.detail.flash,.panel.flash .prose,.panel.flash .sub{animation:none}}
.detail.empty p{color:var(--muted)}
.go{align-self:flex-start;margin-top:6px;background:var(--fg);color:#0b0b0d;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:72ch}
.chip{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700;color:var(--fg2);cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:color-mix(in srgb, var(--c) 22%, transparent);border-color:var(--c);color:var(--fg)}
/* Repères d'avancement unifiés (V3) : à venir · vu · en cours, comme la timeline et les 7 questions */
.chips.steps .chip{color:var(--dim)}
.chips.steps .chip i{background:transparent!important;border:1.5px solid var(--mid);box-sizing:border-box}
.chips.steps .chip.done{color:var(--muted)}
.chips.steps .chip.done i{border-color:transparent;background:color-mix(in srgb,var(--c) 55%,transparent)!important}
.chips.steps .chip.now{color:var(--fg);font-weight:800;background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}
.chips.steps .chip.now i{border-color:transparent;background:var(--c)!important;box-shadow:0 0 8px var(--c)}
.toggle{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px;font-weight:800;font-size:14px;cursor:pointer}
.toggle .sw{width:36px;height:22px;border-radius:999px;background:var(--faint);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:#30d158}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:72ch}
@media (max-width:560px){.rules{grid-template-columns:minmax(0,1fr)}}
.rule{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rule b{font-size:14px}
.rule span{font-size:13.5px;line-height:1.45;color:var(--muted)}
.rule.ok b{color:#30d158}.rule.warn b{color:#ffd60a}.rule.no b{color:#ff453a}
.links{display:flex;flex-direction:column;gap:12px}
.links a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:14px 18px;max-width:46ch;background:var(--surface)}
.links a b{font-size:20px;font-weight:800}
.links a span{color:var(--muted);font-size:14.5px}
.links a:hover{border-color:var(--accent)}

/* Suivi des 7 questions */
.tracker{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px;max-width:72ch}
.tracker .t{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tracker ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px}
.tracker li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);transition:color .3s}
.tracker li::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2);box-sizing:border-box;transition:all .3s}
.tracker li.done{color:var(--muted)}
.tracker li.done::before{border-color:transparent;background:color-mix(in srgb, var(--accent) 45%, transparent)}
.tracker li.now{color:var(--fg);font-weight:800}
.tracker li.now::before{border-color:transparent;background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* Repères : les 7 questions qui s'allument, au-dessus de la timeline */
.foot{display:flex;flex-direction:column;gap:12px}
.beacon{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;padding:14px 4px 0;border-top:1px solid var(--line)}
.bc-head{display:flex;align-items:center;gap:10px;flex:none}
.bc-head .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--glow);box-shadow:0 0 10px var(--glow);transition:background .6s,box-shadow .6s}
.bc-head b{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bc-head .bc-sep{font-size:12.5px;color:var(--mid)}
.bc-head .bc-sub{font-size:12.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.bc-qs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;flex:1;min-width:0}
.bc-q{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 7px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--dim);cursor:pointer;transition:color .4s}
.bc-q::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--mid);box-sizing:border-box;flex:none;transition:all .4s}
.bc-q:hover{color:var(--fg2)}
.bc-q.done{color:var(--muted)}
.bc-q.done::before{border-color:transparent;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.bc-q.now{color:var(--fg);font-weight:800}
.bc-q.now::before{border-color:transparent;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:lit 2.4s ease-in-out infinite}
@keyframes lit{50%{box-shadow:0 0 2px var(--accent)}}
.bc-count{flex:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.bc-count b{color:var(--fg);font-weight:600}
@media (prefers-reduced-motion:reduce){.bc-q.now::before{animation:none}}

/* Lecture guidée : étapes dans l'écran */
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:72ch}
.sdots{display:flex;gap:2px;flex-wrap:wrap}
.sdots button{width:16px;height:22px;border:0;padding:0;background:none;cursor:pointer;position:relative}
.sdots button::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--faint);transition:all .3s}
.sdots button.done::after{background:var(--dim)}
.sdots button.now::after{width:16px;margin-left:-8px;border-radius:4px;background:var(--glow);box-shadow:0 0 8px var(--glow)}
.snext{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--dim)}
.snext b{color:var(--fg);font-weight:600}
.snext kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--fg)}

/* Barre de navigation */
.dock{display:flex;align-items:center;gap:14px}
.nav{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.nav:hover{border-color:var(--line2)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:18px;height:18px}
.segs{flex:1;min-width:0;display:flex;gap:12px}
.grp{flex-grow:var(--n);min-width:0;display:flex;flex-direction:column;gap:6px}
.grp .bars{display:flex;gap:3px}
.grp .bars button{flex:1;min-width:0;height:22px;border:0;padding:0;background:none;cursor:pointer;position:relative}
.grp .bars button::after{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--faint);transition:background .3s}
.grp .bars button.seen::after{background:var(--mid)}
.grp .bars button[aria-current="step"]::after{background:linear-gradient(90deg,var(--glow) calc(var(--p,1)*100%),var(--mid) calc(var(--p,1)*100%));box-shadow:0 0 8px color-mix(in srgb,var(--glow) 60%,transparent)}
.grp small{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp.cur small{color:var(--fg)}
@media (max-width:620px){.grp small{display:none}.segs{gap:6px}}

[hidden]{display:none!important}
/* Sélecteur de version */
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ver{position:relative}
.ver-btn{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 8px;cursor:pointer;font-weight:800;font-size:14px}
.ver-btn:hover{border-color:var(--line2)}
.ver-btn b{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600}
.ver-btn svg{width:14px;height:14px;transition:transform .2s;color:var(--muted)}
.ver-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.ver-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(290px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:2px;box-sizing:border-box}
.ver-menu .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
.ver-menu button,.ver-menu a{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;color:inherit;text-decoration:none}
.ver-menu a:hover,.ver-menu a:focus-visible{background:var(--surface2)}
.v4 .ver-menu a:hover{background:var(--surface2)}
.ver-menu .ver-film{border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;margin-bottom:2px}
.ver-menu button:hover,.ver-menu button:focus-visible{background:var(--surface2)}
.ver-menu .tag{grid-row:span 2;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ver-menu strong{font-size:14px;font-weight:800}
.ver-menu small{grid-column:2;font-size:12.5px;color:var(--muted)}
.ver-menu .ck{grid-row:1 / span 2;grid-column:3;width:16px;height:16px;color:var(--accent);opacity:0}
.ver-menu [aria-checked="true"] .ck{opacity:1}
.ver-menu [aria-checked="true"] .tag{background:var(--accent);border-color:var(--accent);color:#fff}

/* V2 : le cadran sans la montre */
.dialv2{display:none;position:relative;width:100%;max-width:616px;margin-inline:auto;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.v2 .watch,.v2 .watch-hint{display:none}
.v2 .dialv2{display:block}
.v2 .app{max-width:1320px}
.v2 .stage{grid-template-columns:minmax(280px,616px) minmax(0,1fr);gap:clamp(28px,5vw,72px)}
@media (max-width:860px){.v2 .stage{grid-template-columns:minmax(0,1fr)}}
.dial-screen{position:relative;aspect-ratio:1;max-width:100%}
.dial-screen svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.dial-screen svg.enter{animation:faceIn .5s cubic-bezier(.2,.8,.2,1)}
.orbit2{transform-box:view-box;transform-origin:300px 300px;animation:spin 26s linear infinite}
.hand2{transform-box:view-box;transform-origin:300px 300px;transform:rotate(var(--a));animation:settle2 .9s cubic-bezier(.3,1.35,.45,1)}
@keyframes settle2{from{transform:rotate(calc(var(--a) - 40deg))}}
@media (prefers-reduced-motion:reduce){.hand2{animation:none}}
/* Jauges de mesure : chaque compteur part de zéro et se remplit jusqu'à 100 % */
.gauge2{stroke-dasharray:1;stroke-dashoffset:1;animation:gfill 1.3s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes gfill{to{stroke-dashoffset:0}}
.gneedle{transform-box:view-box;animation:gneedle 1.3s cubic-bezier(.3,.8,.3,1) both}
@keyframes gneedle{from{transform:rotate(var(--g0))}to{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.gauge2{animation:none;stroke-dashoffset:0}.gneedle{animation:none}}
.blink2{animation:blink2 1.1s ease-in-out infinite}
@keyframes blink2{0%,100%{opacity:1}50%{opacity:.25}}
.halo2{transform-box:fill-box;transform-origin:center;animation:halo2 1.1s ease-out infinite}
@keyframes halo2{0%{transform:scale(.4);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.sweep2{stroke-dasharray:1;stroke-dashoffset:1;animation:sweep2 1s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes sweep2{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.blink2,.halo2{animation:none}.sweep2{animation:none;stroke-dashoffset:0}}
.rail{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;margin-top:16px}
.rail button{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:none;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;letter-spacing:.1em;cursor:pointer;color:var(--dim);transition:color .3s,background .3s}
.rail button i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.rail button:hover{color:var(--fg)}

/* ---------- Géométrie SVG ---------- */
const CX=184, CY=236;
const rad=a=>a*Math.PI/180;
const P=(r,a)=>[CX+r*Math.sin(rad(a)), CY-r*Math.cos(rad(a))];
const n=v=>v.toFixed(1);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function arc(r,a0,a1,rev){
  const [x0,y0]=P(r,rev?a1:a0),[x1,y1]=P(r,rev?a0:a1);
  const large=(a1-a0)>180?1:0;
  return `M${n(x0)} ${n(y0)}A${r} ${r} 0 ${large} ${rev?0:1} ${n(x1)} ${n(y1)}`;
}
function lobe(rIn,rOut,a0,a1,sw,g=1.6){
  const off=r=>sw*Math.pow(1-(r-rIn)/(rOut-rIn),1.7), pts=[], N=16;
  for(let k=0;k<=N;k++){const r=rIn+(rOut-rIn)*k/N;pts.push(P(r,a0+off(r)+g));}
  for(let k=1;k<N*2;k++){pts.push(P(rOut,a0+g+(a1-a0-2*g)*k/(N*2)));}
  for(let k=N;k>=0;k--){const r=rIn+(rOut-rIn)*k/N;pts.push(P(r,a1+off(r)-g));}
  return "M"+pts.map(p=>n(p[0])+" "+n(p[1])).join("L")+"Z";
}
function wrap(t,max){const w=t.split(" "),out=[];let l="";w.forEach(x=>{if((l+" "+x).trim().length>max){out.push(l.trim());l=x}else l+=" "+x});if(l.trim())out.push(l.trim());return out}

const DEFS = `<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="big" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="38"/></filter>
<clipPath id="disk2"><circle cx="300" cy="300" r="291"/></clipPath>
<radialGradient id="dial" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#121217"/><stop offset="1" stop-color="#000"/></radialGradient>
<linearGradient id="radarSweep" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(-45 .5 .5)"><stop offset="0" stop-color="#30d158" stop-opacity="0"/><stop offset=".5" stop-color="#30d158" stop-opacity=".12"/><stop offset="1" stop-color="#30d158" stop-opacity=".35"/></linearGradient>
</defs>`;

function ticks(every=30, r0=150, r1=156){
  let s="";for(let a=0;a<360;a+=every){const[x0,y0]=P(r0,a),[x1,y1]=P(r1,a);s+=`<line x1="${n(x0)}" y1="${n(y0)}" x2="${n(x1)}" y2="${n(y1)}" stroke="#46464c" stroke-width="${a%90?1:1.8}" stroke-linecap="round"/>`}
  return s;
}
function hands(){
  return `<g id="hands" pointer-events="none">
  <line id="hH" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY-44}" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <line id="hH2" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY-44}" stroke="#f2f2f5" stroke-width="4.5" stroke-linecap="round"/>
  <line id="hM" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY-62}" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <line id="hM2" x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY-62}" stroke="#f2f2f5" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="${CX}" cy="${CY}" r="4.5" fill="#ee2238" stroke="#000" stroke-width="1.5"/></g>`;
}
function nexusCore(r=28,label=true){
  return `<circle cx="${CX}" cy="${CY}" r="${r}" fill="#0c0c0f" stroke="#2c2c31" stroke-width="1.5"/>
  <path d="${arc(r-7,20,150)}" fill="none" stroke="#3a3a40" stroke-width="3" stroke-linecap="round"/>
  <path d="${arc(r-7,200,330)}" fill="none" stroke="#3a3a40" stroke-width="3" stroke-linecap="round"/>
  ${label?`<text x="${CX}" y="${CY+r*0.55}" text-anchor="middle" font-size="7.5" font-weight="800" letter-spacing="1.6" fill="#7a7880">NEXUS</text>`:""}`;
}

/* La roue (cadran de la diapo 4, réutilisé) */
function wheelFace(o){
  if(st.v>=2) return wheel2(o);
  o=Object.assign({sel:null,kind:null,labels:true,shapes:false,gates:true,gateLabels:false,idea:true,hands:true,dim:false},o);
  let s=`<circle cx="${CX}" cy="${CY}" r="160" fill="url(#dial)"/>`+ticks();
  PH.forEach((p,i)=>{
    const isSel = o.kind==="phase" && o.sel===p.id;
    const selShape = o.kind==="shape" && o.sel && SHAPES.find(x=>x.id===o.sel).p===i;
    const hot = isSel || selShape;
    const fade = (o.kind==="phase"||o.kind==="shape") && o.sel && !hot;
    const op = o.dim ? .35 : fade ? .35 : 1;
    const hit = o.kind==="phase" ? ` class="hit" data-id="${p.id}"` : "";
    if(p.id==="drop"){
      s+=`<g opacity="${op}"${hit}><path d="${lobe(122,146,316,352,0,0)}" fill="${p.c}" fill-opacity="${hot?.22:.07}" stroke="${p.c}" stroke-opacity="${hot?1:.6}" stroke-width="1.2"/>`;
      if(o.labels){const lp=`lp${p.id}`;s+=`<path id="${lp}" d="${arc(134,320,348)}" fill="none"/><text font-size="9.5" font-weight="800" letter-spacing="1.6" fill="#f2f2f5" dominant-baseline="middle"><textPath href="#${lp}" startOffset="50%" text-anchor="middle">${p.name.toUpperCase()}</textPath></text>`;}
      s+=`</g>`;
      return;
    }
    const c=i*72;
    s+=`<g opacity="${op}"${hit}>`;
    s+=`<path d="${lobe(40,106,c-36,c+36,34)}" fill="${p.c}" fill-opacity="${hot?.2:.06}" stroke="${p.c}" stroke-opacity="${hot?1:.55}" stroke-width="1.2"/>`;
    s+=`<path d="${arc(70,c-32,c+32)}" fill="none" stroke="${p.c}" stroke-width="${hot?9:6}" stroke-linecap="round" filter="url(#glow)"/>`;
    if(o.labels){
      const lc=c+2.4, bottom=lc>100&&lc<260, id=`lp${p.id}`;
      s+=`<path id="${id}" d="${arc(91,lc-30,lc+30,bottom)}" fill="none"/><text font-size="9.5" font-weight="800" letter-spacing="1.6" fill="#f2f2f5" dominant-baseline="middle"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${p.name.toUpperCase()}</textPath></text>`;
    }
    s+=`</g>`;
  });
  if(o.idea) s+=`<g class="orbit" pointer-events="none"><circle cx="${CX}" cy="${CY-156}" r="${o.bigOrbit?8:5}" fill="#ee2238" filter="url(#glow)"/>${o.bigOrbit?`<circle cx="${CX}" cy="${CY-156}" r="14" fill="#ee2238" fill-opacity=".15" filter="url(#glow)"/>`:""}</g>`;
  if(o.gates){
    GATES.forEach((g,i)=>{
      const [x,y] = i<5 ? P(70,i*72+36) : P(134,352);
      const isSel = o.kind==="gate" && o.sel===g.id;
      const hit = o.kind==="gate" ? ` class="hit" data-id="${g.id}"` : "";
      const big = o.kind==="gate";
      s+=`<g${hit}>`;
      if(big) s+=`<circle cx="${n(x)}" cy="${n(y)}" r="13" fill="transparent"/>`;
      s+=`<circle cx="${n(x)}" cy="${n(y)}" r="${big?(isSel?7.5:5.5):4}" fill="${isSel?"#ee2238":"#f4f4f7"}" filter="url(#glow)"/>`;
      if(o.gateLabels){const [lx,ly] = i<5 ? P(52,i*72+36) : P(134,336);s+=`<text x="${n(lx)}" y="${n(ly)}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="600" fill="${isSel?"#ff6b7a":"#cfcdd5"}">${g.id}</text>`;}
      s+=`</g>`;
    });
  }
  if(o.shapes){
    SHAPES.forEach(sh=>{
      const col=PH[sh.p].c, isSel=o.sel===sh.id;
      const r = sh.drop?134:100;
      const [x,y]=P(r,sh.a);
      let lx,ly,anchor;
      if(sh.drop){[lx,ly]=P(155,333);anchor="end";}
      else{
        [lx,ly]=P(114,sh.a);
        const si=Math.sin(rad(sh.a)), co=Math.cos(rad(sh.a));
        anchor = si>0.25?"start":si<-0.25?"end":"middle";
        ly += co>0.6?-3:co<-0.6?9:3.5;
      }
      s+=`<g class="hit" data-id="${sh.id}"><circle cx="${n(x)}" cy="${n(y)}" r="11" fill="transparent"/>
      <circle cx="${n(x)}" cy="${n(y)}" r="${isSel?6:4}" fill="${col}" filter="url(#glow)"${isSel?` stroke="#fff" stroke-width="1.5"`:""}/>
      <text x="${n(lx)}" y="${n(ly)}" text-anchor="${anchor}" font-size="${isSel?11:10}" font-weight="${isSel?800:600}" fill="${isSel?"#fff":"#c9c7cf"}">${sh.name}</text></g>`;
    });
  }
  s+=nexusCore();
  if(o.hands) s+=hands();
  return s;
}

/* ---------- V2 : grand cadran sans montre ---------- */
const SH_EN={idea:"idea",shape:"shape",spec:"spec",code:"code",build:"build",review:"review",deploy:"deploy",keep:"keep",observe:"observe",analyse:"analyse",opportunity:"opportunity",retirement:"drop"};
const OFF=25, C2=300, R2=140;
const P2=(r,a)=>[C2+r*Math.sin(rad(a)), C2-r*Math.cos(rad(a))];
function arc2(r,a0,a1,rev){
  const [x0,y0]=P2(r,rev?a1:a0),[x1,y1]=P2(r,rev?a0:a1);
  return `M${n(x0)} ${n(y0)}A${r} ${r} 0 ${(a1-a0)>180?1:0} ${rev?0:1} ${n(x1)} ${n(y1)}`;
}
function lobe2(rIn,rOut,a0,a1,sw,g=1.4){
  const off=r=>sw*Math.pow(1-(r-rIn)/(rOut-rIn),1.6), pts=[], N=18;
  for(let k=0;k<=N;k++){const r=rIn+(rOut-rIn)*k/N;pts.push(P2(r,a0+off(r)+g));}
  for(let k=1;k<N*2;k++){pts.push(P2(rOut,a0+g+(a1-a0-2*g)*k/(N*2)));}
  for(let k=N;k>=0;k--){const r=rIn+(rOut-rIn)*k/N;pts.push(P2(r,a1+off(r)-g));}
  return "M"+pts.map(p=>n(p[0])+" "+n(p[1])).join("L")+"Z";
}
const hexRGB=h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));
function ringColor(a){
  const t=((a-OFF)%360+360)%360, i=Math.floor(t/72), f=(t-i*72)/72;
  const w=f<.32?0:f>.68?1:(f-.32)/.36, s=w*w*(3-2*w);
  const c0=hexRGB(PH[i].c), c1=hexRGB(PH[(i+1)%5].c);
  return "rgb("+c0.map((v,k)=>Math.round(v+(c1[k]-v)*s)).join(",")+")";
}
function hands2(ang){
  const len=96,w=10;
  const body=`<line x1="${C2}" y1="${C2+16}" x2="${C2}" y2="${C2-len}" stroke="#050507" stroke-width="${w+5}" stroke-linecap="round"/><line x1="${C2}" y1="${C2}" x2="${C2}" y2="${C2-len}" stroke="#d9d8de" stroke-width="${w}" stroke-linecap="round"/><line x1="${C2}" y1="${C2-24}" x2="${C2}" y2="${C2-len+4}" stroke="#25252b" stroke-width="${w-5}" stroke-linecap="round"/>`;
  const g = ang==null ? `<g class="orbit2">${body}</g>` : `<g class="hand2" style="--a:${n(ang)}deg">${body}</g>`;
  return `<g pointer-events="none">${g}<circle cx="${C2}" cy="${C2}" r="6.5" fill="#ff3b4f" stroke="#050507" stroke-width="2"/></g>`;
}
/* Sortie vers Drop : suit la frontière ondulée entre Deepen et Discover (même courbe que les pétales) */
function exitD2(r0,r1){
  const gA=OFF+36+4*72, off=r=>r>=224?0:46*Math.pow(1-(r-52)/(224-52),1.6), pts=[];
  for(let r=r0;r<=r1;r+=3){const w=Math.min(1,Math.max(0,(r-R2)/30));pts.push(P2(r,gA+off(r)*w));}
  pts.push(P2(r1,gA));
  return "M"+pts.map(p=>n(p[0])+" "+n(p[1])).join("L");
}
function wheel2(o){
  o=Object.assign({sel:null,kind:null,shapes:false,gateLabels:false},o);
  const selPh = o.kind==="phase" ? o.sel : o.kind==="shape"&&o.sel ? PH[SHAPES.find(x=>x.id===o.sel).p].id : null;
  let s=`<circle cx="${C2}" cy="${C2}" r="292" fill="#040406" stroke="#26262c" stroke-width="1.5"/>`;
  // Écran « L'idée » : les douze formes restent à 100 %, le reste du cadran passe en retrait
  // Écran « Portes qualité » : même principe, les points de passage G1…G6 à 100 %, le reste en retrait
  const focusShapes = o.kind==="shape", focusGates = o.kind==="gate", bgOp = o.sel ? .5 : .28;
  if(focusShapes||focusGates) s+=`<g opacity="${bgOp}">`;
  // halos de couleur
  s+=`<g clip-path="url(#disk2)">`;
  PH.slice(0,5).forEach((p,i)=>{const [x,y]=P2(165,OFF+i*72);s+=`<circle cx="${n(x)}" cy="${n(y)}" r="${selPh===p.id?120:100}" fill="${p.c}" opacity="${selPh===p.id?.3:selPh?.07:.15}" filter="url(#big)"/>`;});
  s+=`</g>`;
  // graduations
  for(let a=0;a<360;a+=6){const maj=a%30===0,[x0,y0]=P2(maj?272:278,a),[x1,y1]=P2(284,a);s+=`<line x1="${n(x0)}" y1="${n(y0)}" x2="${n(x1)}" y2="${n(y1)}" stroke="${maj?"#55555c":"#2c2c32"}" stroke-width="${maj?2:1}" stroke-linecap="round"/>`;}
  // pétales
  PH.slice(0,5).forEach((p,i)=>{
    const c=OFF+i*72, hot=selPh===p.id, fade=selPh&&!hot;
    const hit = o.kind==="phase" ? ` class="hit" data-id="${p.id}"` : "";
    s+=`<g${hit} opacity="${fade?.4:1}"><path d="${lobe2(52,224,c-36,c+36,46)}" fill="${p.c}" fill-opacity="${hot?.16:.07}" stroke="${p.c}" stroke-opacity="${hot?1:.8}" stroke-width="1.4"/>
    <path d="${lobe2(58,204,c-31,c+31,40,2.4)}" fill="none" stroke="${p.c}" stroke-opacity="${hot?.6:.32}" stroke-width="1"/></g>`;
  });
  // Drop : voie de sortie, concentrique, juste sous les graduations
  {
    const p=PH[5], hot=selPh==="drop", fade=selPh&&!hot&&selPh!=="deepen", RD=258;
    const hit = o.kind==="phase" ? ` class="hit" data-id="drop"` : "";
    s+=`<g${hit} opacity="${fade?.45:1}">
    <path d="${arc2(RD,336,14)}" fill="none" stroke="transparent" stroke-width="26"/>
    <path d="${arc2(RD,336,14)}" fill="none" stroke="${p.c}" stroke-opacity=".18" stroke-width="14" stroke-linecap="round"/>
    <path d="${arc2(RD,336,14)}" fill="none" stroke="${p.c}" stroke-width="${hot?6:3.5}" stroke-linecap="round" opacity="${hot?1:.75}"${hot?' filter="url(#glow)"':""}/>
    <path id="lqdrop" d="${arc2(RD-17,354,22)}" fill="none"/><text font-size="13" font-weight="900" letter-spacing="2.6" fill="${hot?"#fff":"#ff8a9c"}" dominant-baseline="middle"><textPath href="#lqdrop" startOffset="8%" text-anchor="start">DROP</textPath></text></g>`;
  }
  // anneau dégradé
  s+=`<circle cx="${C2}" cy="${C2}" r="${R2}" fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="26"/><g filter="url(#glow)">`;
  // progression : jusqu'où l'idée est allée
  let prog=null, endA=null;
  if(o.kind==="gate"&&o.sel){const k=GATES.findIndex(g=>g.id===o.sel);prog=k;endA=k<5?OFF+36+k*72:null;}
  else if(selPh){prog=PH.findIndex(p=>p.id===selPh);endA=prog<5?OFF+36+prog*72:null;
    if(o.kind==="shape"&&o.sel){const sh=SHAPES.find(x=>x.id===o.sel);if(!sh.drop)endA=sh.a+OFF;}}
  const phaseOf=a=>Math.floor((((a-(OFF-36))%360)+360)%360/72);
  for(let a=0;a<360;a+=2){const lit=prog==null||prog>=5||phaseOf(a+1)<=prog&&(endA==null||((((a+1)-(OFF-36))%360+360)%360)<=endA-(OFF-36));
    s+=`<path d="${arc2(R2,a,a+2.6)}" fill="none" stroke="${ringColor(a+1)}" stroke-width="${prog==null?7:lit?9:5}" opacity="${lit?1:.16}"/>`;}
  if(selPh&&selPh!=="drop"&&prog==null){const i=PH.findIndex(p=>p.id===selPh),c=OFF+i*72;s+=`<path d="${arc2(R2,c-34,c+34)}" fill="none" stroke="${PH[i].c}" stroke-width="13" stroke-linecap="round"/>`;}
  s+=`</g>`;
  // libellés de phase
  PH.slice(0,5).forEach((p,i)=>{

    // intent mode : ÉQUIPES en gros, lumineux — les autres en retrait

  // noms des registres sur la piste
  REG.forEach(R=>{

    s+=`<path id="${id}" d="${arc(bottom?153:148,lc-40,lc+40,bottom)}" fill="none"/><text${mode==="register"?` class="hit" data-id="${R.id}"`:""} font-size="${mode==="register"&&sel===R.id?11:9.5}" font-weight="800" letter-spacing="2.6" fill="${R.c}" opacity="${on?1:(mode==="register"?.25:.4)}" dominant-baseline="middle"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${R.name.toUpperCase()}</textPath></text>`;
  });

    <text x="${CX}" y="${CY+33}" text-anchor="middle" font-size="7.5" font-weight="800" letter-spacing="1.6" fill="#a09ea8">REGISTRES</text>`;
    return s;
  }
  // centre : Nexus par défaut, ou icône contextuelle en mode intent
  if(mode==="intent"&&sel){
    // fond noir + icône dédiée à chaque step (remplace le moyeu Nexus)
    s+=`<circle cx="${CX}" cy="${CY}" r="50" fill="#050508" stroke="#1a1a20" stroke-width="1.2"/>`;
    if(sel==="write"){
      // stylo : les personnes écrivent — style cadenas (épuré, centré, bold)

        <line x1="${CX+12}" y1="${CY-16}" x2="${CX-8}" y2="${CY+8}" stroke="#ff375f" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

        <circle cx="${CX}" cy="${CY-4}" r="18" fill="#1a1806" stroke="#ffd60a" stroke-width="2.5" filter="url(#glow)"/>

  if(mode==="intent"){

  s+=`<circle cx="${cx}" cy="${cy}" r="${Rc}" fill="#0d0d10" stroke="#2c2c31"/><text x="${cx}" y="${n(cy+8*k)}" text-anchor="middle" font-size="${n(48*k)}" font-weight="900" fill="#ee2238">7</text><text x="${cx}" y="${n(cy+28*k)}" text-anchor="middle" font-size="${n(9*k)}" font-weight="800" letter-spacing="1.6" fill="#a09ea8">QUESTIONS</text>`;

  });

/* Jauges de mesure */
function measureFace(sel){
  let s="";
  const ki = sel ? FAM.findIndex(f=>f.id===sel) : -1;
  const STAGE=["référence","creux","reprise","gain"];
  const C=[[246,174],[246,298],[122,298],[122,174]];
  // radar sonar : fond vert très subtil
  s+=`<circle cx="${CX}" cy="${CY}" r="146" fill="#0a1a0e" fill-opacity=".35"/>`;
  // cercles concentriques (grille radar)
  [30,60,90,120,146].forEach(r=>s+=`<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="#1a3a22" stroke-width="${r===146?1.4:.7}" stroke-opacity="${r===146?.8:.4}"/>`);
  // lignes radiales toutes les 30° (grille complète)
  for(let a=0;a<360;a+=30){const [x1,y1]=P(6,a),[x2,y2]=P(146,a);s+=`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="#1a3a22" stroke-width="${a%90===0?.8:.4}" stroke-opacity="${a%90===0?.6:.3}"/>`;};
  // graduations aux 90° (tirets plus forts)
  [0,90,180,270].forEach(a=>{const [x1,y1]=P(140,a),[x2,y2]=P(154,a);s+=`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="#30d158" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".5"/>`;});
  // degrés aux 4 points cardinaux
  [[0,"0°"],[90,"90°"],[180,"180°"],[270,"270°"]].forEach(([a,l])=>{const [x,y]=P(156,a);s+=`<text x="${n(x)}" y="${n(y+3)}" text-anchor="middle" font-size="7" font-weight="600" fill="#30d158" fill-opacity=".4">${l}</text>`;});
  // balayage radar : cône vert qui s'estompe (60°) + point lumineux
  s+=`<g class="orbit" pointer-events="none"><path d="M${CX} ${CY}L${n(CX-146*Math.sin(rad(-60)))} ${n(CY+146*Math.cos(rad(-60)))}A146 146 0 0 1 ${CX} ${CY-146}Z" fill="url(#radarSweep)"/><circle cx="${CX}" cy="${CY-146}" r="4.5" fill="#30d158" filter="url(#glow)"/></g>`;
  // libellés famille aux 4 quadrants
  FAM.forEach((f,k)=>{
    const cur=k===ki, lit=ki<0||k<=ki;
    const am=k*90+45, [lx,ly]=P(162,am), right=Math.sin(rad(am))>0;
    s+=`<text x="${n(lx)}" y="${n(ly+4)}" text-anchor="${right?"start":"end"}" font-size="${cur?10.5:9}" font-weight="700" fill="${cur?f.c:lit?"#8a8890":"#44434a"}">${STAGE[k]}</text>`;
  });
  // les 4 jauges
  FAM.forEach((f,i)=>{
    const [x,y]=C[i], on=sel===f.id, fade=sel&&!on, r=44;
    const ga=(a)=>[x+r*Math.sin(rad(a)),y-r*Math.cos(rad(a))];
    const [x0,y0]=ga(-135),[x1,y1]=ga(135);
    const d=`M${n(x0)} ${n(y0)}A${r} ${r} 0 1 1 ${n(x1)} ${n(y1)}`;
    const [mx,my]=ga(135);
    s+=`<g class="hit" data-id="${f.id}" opacity="${fade?.4:1}"><circle cx="${x}" cy="${y}" r="54" fill="transparent"/><path d="${d}" fill="none" stroke="#1d1d22" stroke-width="9" stroke-linecap="round"/><path class="gauge2" pathLength="1" style="animation-delay:${(i*.14).toFixed(2)}s" d="${d}" fill="none" stroke="${f.c}" stroke-opacity="${on?1:.75}" stroke-width="${on?9:6.5}" stroke-linecap="round"${on?` filter="url(#glow)"`:""}/>
    <g class="gneedle" style="transform-origin:${x}px ${y}px;--g0:-270deg;animation-delay:${(i*.14).toFixed(2)}s"><circle cx="${n(mx)}" cy="${n(my)}" r="4.5" fill="#fff" stroke="#000" stroke-width="2"/></g>
    <text x="${x}" y="${y+2}" text-anchor="middle" font-size="${f.name.length>10?9.5:11.5}" font-weight="900" fill="#fff">${f.name}</text>
    <text x="${x}" y="${y+15}" text-anchor="middle" font-size="8" font-weight="600" fill="#a09ea8">${f.sub}</text></g>`;
  });
  return s;
}

const VNAME={2:{fr:"Overview",en:"Overview"},3:{fr:"Step by step",en:"Step by step"},4:{fr:"Landing",en:"Landing"},5:{fr:"Chrono",en:"Chrono"}};
const VBADGE={3:1,2:2,4:3,5:5};
let savedV=3;try{const v=localStorage.getItem("pdlc-version-e");if(["2","3","4"].includes(v))savedV=+v;}catch(e){}
const st={i:0,sel:null,absorb:false,seen:new Set([0]),v:savedV,step:0};
const $=id=>document.getElementById(id);
let lang="en";try{const ll=localStorage.getItem("pdlc-lang");if(ll==="fr"||ll==="en")lang=ll;}catch(e){}
const t=(en,fr)=>lang==="en"?en:fr;
const L=(obj,f)=>{const k=f+"En";return lang==="en"&&obj[k]!==undefined?obj[k]:obj[f];};
let S=makeS();
const secName=id=>{const s=SECTIONS.find(x=>x.id===id);return L(s,"name");};

function corners(sl,i){
  return `<text x="34" y="40" font-size="10" font-weight="900" letter-spacing="1.3" fill="${sl.glow}">${esc(secName(sl.sec).toUpperCase())}</text>
  <text id="clk" x="334" y="42" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="17" font-weight="600" fill="#f2f2f5">--:--</text>
  <text x="34" y="430" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6d76">${String(i+1).padStart(2,"0")}/${S.length}</text>
  <text x="334" y="430" text-anchor="end" font-size="10" font-weight="900" fill="#6f6d76">zenika<tspan fill="#ee2238">.</tspan></text>`;
}
function faceSVG(i,sel,mini){
  const sl=S[i];
  if(st.v>=2){
    const body = sl.face2 ? sl.face2(sel,st) : sl.wheel ? sl.face(sel,st) : `<circle cx="300" cy="300" r="292" fill="#040406" stroke="#26262c" stroke-width="1.5"/><circle cx="300" cy="300" r="292" fill="${sl.glow}" opacity=".08"/>${(()=>{const k=sl.big||1.27;return `<svg x="${(300-184*k).toFixed(1)}" y="${(300-236*k).toFixed(1)}" width="${(368*k).toFixed(1)}" height="${(448*k).toFixed(1)}" viewBox="0 0 368 448" overflow="visible">${sl.face(sel,st)}</svg>`;})()}`;
    return `<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" font-family="Nunito, Segoe UI, system-ui, sans-serif" role="img" aria-label="${esc(sl.kicker)}">${mini?"":DEFS}${body}</svg>`;
  }
  return `<svg viewBox="0 0 368 448" xmlns="http://www.w3.org/2000/svg" font-family="Nunito, Segoe UI, system-ui, sans-serif" role="img" aria-label="${esc(sl.kicker)}">${mini?"":DEFS}${sl.face(sel,st)}${corners(sl,i)}</svg>`;
}
function updateClock(){
  const d=new Date(), h=d.getHours(), m=d.getMinutes(), sec=d.getSeconds();
  [["h2h",(h%12+m/60)*30],["h2m",(m+sec/60)*6],["h2s",sec*6]].forEach(([id,a])=>document.querySelectorAll("#"+id).forEach(e=>e.setAttribute("transform",`rotate(${a} 300 300)`)));
  const t=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  document.querySelectorAll("#clk").forEach(e=>e.textContent=t);
  const ha=(h%12+m/60)*30, ma=m*6;
  ["hH","hH2"].forEach(id=>{const e=$(id);if(e)e.setAttribute("transform",`rotate(${ha} ${CX} ${CY})`)});
  ["hM","hM2"].forEach(id=>{const e=$(id);if(e)e.setAttribute("transform",`rotate(${ma} ${CX} ${CY})`)});
}

function answersNow(){
  const sl=S[st.i];
  if(sl.dynAnswers){const it=sl.items.find(x=>x.id===st.sel);return it?it.a:[];}
  if(st.i===1 && st.sel) return [st.sel];
  return sl.answers||[];
}

function renderFace(animate){
  if(st.v>=4){$("screen").innerHTML="";$("screen2").innerHTML="";return;}
  const sc=st.v>=2?$("screen2"):$("screen");
  (st.v>=2?$("screen"):$("screen2")).innerHTML="";
  sc.innerHTML=faceSVG(st.i,st.sel);
  renderRail();
  const svg=sc.firstChild;
  if(animate){svg.classList.add("enter");}
  updateClock();
}

function renderPanel(){
  const sl=S[st.i], p=$("panel");
  let h=`<div class="eyebrow"><span class="dot"></span><b>${esc(secName(sl.sec))}</b><span>${lang==="en"&&sl.kickerEn?sl.kickerEn:sl.kicker}</span><span>${String(st.i+1).padStart(2,"0")} / ${S.length}</span></div>`;
  h+=`<h1>${lang==="en"&&sl.titleEn?sl.titleEn:sl.title}</h1>`;
  if(sl.sub) h+=`<p class="sub">${lang==="en"&&sl.subEn?sl.subEn:sl.sub}</p>`;
  h+=`<div class="prose">${(lang==="en"&&sl.parasEn?sl.parasEn:sl.paras).map((t,k)=>`<p>${t}</p>`).join("")}${sl.toggle&&st.absorb?`<p class="lead">${lang==="en"&&sl.absorbTextEn?sl.absorbTextEn:sl.absorbText}</p>`:""}</div>`;
  if(sl.toggle) h+=`<button class="toggle" id="absorb" type="button" aria-pressed="${st.absorb}"><span class="sw"></span>${t("Absorb first","Absorber d'abord")}</button>`;
  if(sl.items){
    const noChips = st.v>=2 && sl.railItems;
    const it=sl.items.find(x=>x.id===st.sel);
    if(it){
      const stepTag = st.v===3 ? `${t("Step","Étape")} ${st.step+1}/${steps(st.i).length} · ` : "";
      h+=`<div class="detail on${st.flash?" flash":""}" style="--c:${it.c}"><div class="k"><i style="background:${it.c};box-shadow:0 0 8px ${it.c}"></i>${esc(stepTag+(st.v>=2&&it.k2?it.k2:it.k))}</div><h2>${esc(st.v>=2&&it.t2?it.t2:it.t)}</h2><p>${esc(it.b)}</p>${it.m?`<p class="meta">${esc(it.m)}</p>`:""}${it.go!=null?`<button class="go" type="button" data-go="${it.go}">${t("Review this dial","Revoir ce cadran")} →</button>`:""}</div>`;
    } else h+=`<div class="detail empty"><p>${lang==="en"&&sl.hintEn?sl.hintEn:sl.hint}</p></div>`;
    if(!noChips&&st.v!==3) h+=`<div class="chips" role="group" aria-label="Éléments du cadran">${sl.items.map(x=>`<button class="chip" type="button" data-id="${x.id}" aria-pressed="${x.id===st.sel}" style="--c:${x.c}"><i style="background:${x.c}"></i>${esc(st.v>=2&&x.label2?x.label2:x.label)}</button>`).join("")}</div>`;
  }
  if(sl.extra) h+=sl.extra;
  if(st.v===3){
    const a=steps(st.i), last=st.step===a.length-1&&st.i===S.length-1;
    const nm=x=>x.absorb?t("Absorb first","Absorber d'abord"):x.sel?(()=>{const it=sl.items.find(y=>y.id===x.sel);return st.v>=2&&it.label2?it.label2:it.label})():t("Overview","Vue d'ensemble");
    const stc=x=>x.sel?(sl.items.find(y=>y.id===x.sel)||{}).c||sl.glow:sl.glow;
    h+=`${a.length>1?`<div class="chips steps" role="group" aria-label="Étapes de cet écran">${a.map((x,k)=>`<button type="button" class="chip ${k<st.step?"done":k===st.step?"now":""}" data-step="${k}" style="--c:${stc(x)}"${k===st.step?' aria-current="step"':""}><i></i>${esc(nm(x))}</button>`).join("")}</div>`:""}<div class="stepper">
    <span class="snext">${a.length>1?`<b>${st.step+1}/${a.length}</b> · `:""}${last?t("End of tour","Fin du parcours"):st.step<a.length-1?`${t("Next:","Suite :")} ${esc(nm(a[st.step+1]))}`:`${t("Next:","Suite :")} ${esc(lang==="en"&&S[st.i+1].kickerEn?S[st.i+1].kickerEn:S[st.i+1].kicker)}`}<kbd>→</kbd></span></div>`;
  }
  const now=new Set(answersNow()), done=new Set();
  for(let k=0;k<st.i;k++)(S[k].answers||[]).forEach(a=>done.add(a));
  const wasFocus=p.classList.contains("focus");
  p.innerHTML=h;
  p.classList.toggle("focus",!!(sl.items&&sl.items.some(x=>x.id===st.sel)));
  p.classList.toggle("flash",!!st.flash&&!wasFocus&&p.classList.contains("focus"));
  st.flash=false;
  renderBeacon(now,done);
}

function renderRail(){
  if(st.v<2) return;
  const sl=S[st.i];
  const on = st.i===2 ? st.sel : (st.i===3&&st.sel ? PH[SHAPES.find(x=>x.id===st.sel).p].id : null);
  $("rail").innerHTML=PH.map((p,k)=>`${k===5?'<span class="sep"></span>':""}<button type="button" data-ph="${p.id}" class="${on===p.id?"on":""}" style="--c:${p.c}" aria-pressed="${on===p.id}" title="${p.name}"><i></i>${p.en.toUpperCase()}</button>`).join("");
}

  const cls=q=>now.has(q.id)?"now":done.has(q.id)?"done":"";
  const lit=QS.filter(q=>now.has(q.id)||done.has(q.id)).length;
  $("beacon").innerHTML=`<div class="bc-head"><span class="dot"></span><b>${String(si+1).padStart(2,"0")} · ${esc(secName(sl.sec))}</b><span class="bc-sep">›</span><span class="bc-sub">${esc(sl.kicker)}</span></div>
  <div class="bc-qs" role="group" aria-label="Les 7 questions du Comex">${QS.map((q,k)=>`<button type="button" class="bc-q ${cls(q)}" data-q="${q.id}" title="Q${k+1} · ${esc(q.name)} — ${esc(q.q)}"${now.has(q.id)?' aria-current="true"':""}>${esc(q.short)}</button>`).join("")}</div>
  <span class="bc-count"><b>${lit}</b>/7 ${t("lit","éclairées")}</span>`;
}

function renderDock(){
  let h="";
  SECTIONS.forEach(sec=>{
    const idx=S.map((s,k)=>s.sec===sec.id?k:-1).filter(k=>k>=0);
    const cur=idx.includes(st.i);
    h+=`<div class="grp${cur?" cur":""}" style="--n:${idx.length}"><div class="bars">${idx.map(k=>`<button type="button" data-i="${k}" aria-label="${k+1}. ${esc(S[k].kicker)}" class="${st.seen.has(k)?"seen":""}"${k===st.i?` aria-current="step" style="--p:${st.v===3?((st.step+1)/steps(k).length):1}"`:""}></button>`).join("")}</div><small>${L(sec,"name")}</small></div>`;
  });
  $("segs").innerHTML=h;
  $("prev").disabled=st.i===0; $("next").disabled=st.i===S.length-1;
}

function render(animate){
  const sl=S[st.i];
  document.documentElement.style.setProperty("--glow",sl.glow);
  renderFace(animate); renderPanel(); renderDock();
}

let crownPos=0;
function steps(i){
  const sl=S[i], a=[{sel:null,absorb:false}];
  if(sl.toggle) a.push({sel:null,absorb:true});
  (sl.items||[]).forEach(x=>a.push({sel:x.id,absorb:false}));
  return a;
}
function setStep(k){
  const a=steps(st.i); st.step=Math.max(0,Math.min(a.length-1,k));
  st.sel=a[st.step].sel; st.absorb=a[st.step].absorb; st.flash=true;
  renderFace(false); renderPanel(); renderDock();
}
function next(){
  if(st.v===3 && st.step<steps(st.i).length-1){setStep(st.step+1);return;}
  go(st.i+1);
}
function prev(){
  if(st.v===3 && st.step>0){setStep(st.step-1);return;}
  go(st.i-1,st.v===3);
}
function go(i,atEnd){
  i=Math.max(0,Math.min(S.length-1,i));
  if(i===st.i) return;
  crownPos+= (i>st.i?8:-8); $("crown").style.backgroundPosition=`0 ${crownPos}px`;
  st.i=i; st.sel=S[i].def||null; st.absorb=false; st.seen.add(i);
  if(st.v===3){const a=steps(i);st.step=atEnd?a.length-1:0;st.sel=a[st.step].sel;st.absorb=a[st.step].absorb;}
  try{history.replaceState(null,"","#d"+(i+1))}catch(e){}
  render(true);
}
function select(id){
  const sl=S[st.i];
  if(!sl.items||!sl.items.some(x=>x.id===id)) return;
  st.sel = st.sel===id && (!sl.def||st.v===3) ? null : id;
  if(st.v===3){st.absorb=false;st.step=Math.max(0,steps(st.i).findIndex(x=>x.sel===st.sel&&!x.absorb));}
  st.flash=true;
  renderFace(false); renderPanel(); renderDock();
}

/* ---------- Language toggle ---------- */
function setLang(l){
  lang=l;try{localStorage.setItem("pdlc-lang",l)}catch(e){}
  $("langSw").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.lang===l));
  const gt=$("galTitle");if(gt)gt.textContent=t("All dials","Tous les cadrans");
  const gc=$("galClose");if(gc)gc.textContent=t("Close","Fermer");
  $("whintText").textContent=t("Touch the dial · turn the crown","Touchez le cadran · tournez la couronne");
  document.querySelectorAll(".fLabel").forEach(e=>e.textContent=t("All dials","Tous les cadrans"));
  $("brandSub").textContent=t("The Augmented PDLC","Le PDLC augmenté");
  $("verName").textContent=VNAME[st.v][lang];
  v4built=false;
  S=makeS();
  S5=makeS5();
  built5=false;
  if(st.v===4) buildV4();
  if(st.v===5) buildV5();
  render(false);
}
$("langSw").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(b&&b.dataset.lang!==lang)setLang(b.dataset.lang);});
/* ---------- Événements ---------- */
["screen","screen2"].forEach(id=>$(id).addEventListener("click",e=>{const t=e.target.closest("[data-id]");if(t){select(t.getAttribute("data-id"));}else if(!S[st.i].items){next();}}));
$("rail").addEventListener("click",e=>{const b=e.target.closest("[data-ph]");if(!b)return;if(st.i!==2)go(2);select(b.dataset.ph);});
$("verBtn").addEventListener("click",()=>toggleMenu());
$("verMenu").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;toggleMenu(false);$("verBtn").focus();if(+b.dataset.v!==st.v)setVersion(+b.dataset.v);});
document.addEventListener("click",e=>{if(!$("verMenu").hidden&&!e.target.closest("#ver"))toggleMenu(false);});
$("verMenu").addEventListener("keydown",e=>{const items=[...$("verMenu").querySelectorAll("[data-v]")],k=items.indexOf(document.activeElement);if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();e.stopPropagation();items[(k+(e.key==="ArrowDown"?1:items.length-1))%items.length].focus();}else if(e.key==="Escape"){e.stopPropagation();toggleMenu(false);$("verBtn").focus();}});
$("panel").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){if(c.dataset.step!=null)setStep(+c.dataset.step);else select(c.dataset.id);return;}
  const g=e.target.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  if(e.target.closest("#absorb")){st.absorb=!st.absorb;if(st.absorb)st.sel=null;if(st.v===3)st.step=st.absorb?1:0;renderFace(false);renderPanel();renderDock();return;}
  const d=e.target.closest("[data-step]");if(d){setStep(+d.dataset.step);return;}
});
$("beacon").addEventListener("click",e=>{const b=e.target.closest("[data-q]");if(!b)return;const q=b.dataset.q;
  const k=S.findIndex((x,i)=>i>1&&(x.answers||[]).includes(q));
  if(k>=0&&k!==st.i){go(k);return;}
  if(k<0||k===st.i){go(1);st.sel=q;renderFace(false);renderPanel();}
});
$("segs").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)go(+b.dataset.i);});
$("prev").onclick=prev; $("next").onclick=next;
$("crown").onclick=next;
let wheelLock=0;
const onWheel=e=>{if(Math.abs(e.deltaY)<4)return;e.preventDefault();const t=Date.now();if(t-wheelLock<550)return;wheelLock=t;e.deltaY>0?next():prev();};
$("dialv2").addEventListener("wheel",onWheel,{passive:false});
$("watch").addEventListener("wheel",e=>{if(Math.abs(e.deltaY)<4)return;e.preventDefault();const t=Date.now();if(t-wheelLock<550)return;wheelLock=t;e.deltaY>0?next():prev();},{passive:false});
let tx=null;
["watch","dialv2"].forEach(id=>{
$(id).addEventListener("touchstart",e=>{tx=e.touches.length===1?[e.touches[0].clientX,e.touches[0].clientY]:null},{passive:true});
$(id).addEventListener("touchend",e=>{if(!tx)return;const dx=e.changedTouches[0].clientX-tx[0],dy=e.changedTouches[0].clientY-tx[1];if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))(dx<0?next():prev());tx=null;});
});

function openGallery(){
  $("grid").innerHTML=S.map((s,k)=>`<button class="mini${k===st.i?" cur":""}" type="button" data-i="${k}"><div class="sc">${faceSVG(k,s.def||null,false)}</div><span>${esc(lang==="en"&&s.kickerEn?s.kickerEn:s.kicker)}<em>${String(k+1).padStart(2,"0")} · ${esc(secName(s.sec))}</em></span></button>`).join("");
  $("gallery").hidden=false; updateClock(); $("closeFaces").focus();
}
function closeGallery(){$("gallery").hidden=true;}
$("openFaces").onclick=openGallery; $("side").onclick=openGallery; $("closeFaces").onclick=closeGallery;
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b){closeGallery();go(+b.dataset.i);}});
document.addEventListener("keydown",e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||st.v===4)return;
  if(st.v===5){if(!$("verMenu").hidden||e.target.closest&&e.target.closest("#ver"))return;const onB=e.target.closest&&e.target.closest("button,a");if(["ArrowRight","PageDown","ArrowDown"].includes(e.key)){go5(c5+1,true);e.preventDefault();}else if(["ArrowLeft","PageUp","ArrowUp"].includes(e.key)){go5(c5-1,true);e.preventDefault();}else if(e.key===" "&&!onB){togglePlay5();e.preventDefault();}else if(e.key==="Home")go5(0,true);else if(e.key==="End")go5(S5.length-1,true);return;}
  if(!$("gallery").hidden){if(e.key==="Escape")closeGallery();return;}
  if(!$("verMenu").hidden||e.target.closest&&e.target.closest("#ver")) return;
  const onBtn=e.target.closest&&e.target.closest("button,a");
  if(e.shiftKey&&e.key==="ArrowRight"){go(st.i+1);e.preventDefault();}
  else if(e.shiftKey&&e.key==="ArrowLeft"){go(st.i-1);e.preventDefault();}
  else if(["ArrowRight","PageDown","ArrowDown"].includes(e.key)||(e.key===" "&&!onBtn)){next();e.preventDefault();}
  else if(["ArrowLeft","PageUp","ArrowUp"].includes(e.key)){prev();e.preventDefault();}
  else if(e.key==="Home")go(0); else if(e.key==="End")go(S.length-1);
});
function fromHash(){const m=/^#d(\d+)$/.exec(location.hash);return m?Math.min(S.length,Math.max(1,+m[1]))-1:0;}
const hashV=()=>{const m=/^#v([1-5])$/.exec(location.hash);return m?+m[1]:null;};
window.addEventListener("hashchange",()=>{const v=hashV();if(v){if(v!==st.v)setVersion(v);return;}go(fromHash());});
{const v0=hashV();if(v0)st.v=v0;}

st.i=fromHash(); st.sel=S[st.i].def||null; st.seen.add(st.i);
if(st.v===3){st.sel=null;st.step=0;}
applyBody();
$("verTag").textContent="V"+(VBADGE[st.v]||st.v); $("verName").textContent=VNAME[st.v][lang];
$("verMenu").querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-checked",String(+b.dataset.v===st.v)));
render(false);
setInterval(updateClock,1000);
})();
</script>
